# Baut das Anwendungs-Image und legt es in der GitHub Container Registry ab.
#
# Das Image enthaelt ausschliesslich die Anwendung. Die Datenbank laeuft auf dem
# Server als eigener Dienst (siehe docker-compose.prod.yml) - so ueberleben die
# Gaestedaten jedes Deployment.
name: Image bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  pruefen:
    name: Typen pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  bauen:
    name: Bauen und veroeffentlichen
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Bei Pull Requests wird nur gebaut, nicht veroeffentlicht.
      - name: An der Registry anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          # Server laeuft auf amd64. Fuer ARM-Server zusaetzlich linux/arm64
          # eintragen - der Build dauert dann deutlich laenger (Emulation).
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
